
services:
  banco:
    image: postgis/postgis:17-3.5
    container_name: projeto_mobile_banco
    restart: unless-stopped
    environment:
      POSTGRES_DB: projeto_mobile
      POSTGRES_USER: projeto_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_dados_iniciais.sql:/docker-entrypoint-initdb.d/02_dados_iniciais.sql:ro
      - ./database/04_importar_locais.sql:/docker-entrypoint-initdb.d/04_importar_locais.sql:ro
      - ./database/07_dados_demonstracao_sensoriais.sql:/docker-entrypoint-initdb.d/07_dados_demonstracao_sensoriais.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projeto_dev -d projeto_mobile"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dados_postgres:
